[package]
name = "wca-core"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "wheelchair-agent-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = { version = "1", features = ["derive"] }
