为什么认定同类：账本里 crates/wca-core/src/settings.rs 与 tests/test-settings.mjs 此前 0 条记录；#74 删除唯一读者时也没有入账，故本轮在账本上是首次可断言记录，记“新领土”。族名按“设置键退休”起，下一轮遇到同类残留键直接归入。
