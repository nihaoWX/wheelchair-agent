# The panel overlay: the `wca` profile with every deployment-only row switched off.
#
# install.sh writes this file to `<data root>/deployments/panel.yml`; the panel is started with
#   dsh --profile wca --patch <data root>/deployments/panel.yml
# It is not a deployment and never enters deployments.json.
#
#   WHEELCHAIR_PANEL_PORT       settings "panel.port" (3080 by default), or --port for one run
#   DSH_SUPERAGENT_STATE_DIR    <data root>/panel, the instance's own state directory
#
# The !!js expression is evaluated by dsh while it composes the profile, so a comment-only edit here
# does not trigger the install fingerprint's "stale" notice.
- id: webserver
  config:
    host: 127.0.0.1
    port: !!js Number(process.env.WHEELCHAIR_PANEL_PORT ?? 3080)
# The four sections read the shared data root and each deployment's HTTP API. Pollers, auto-merge,
# cold-install notices and the hook runner belong to the deployments; a second reader here would
# duplicate that work and fire every hook twice.
- id: wheelchair-webui
  config:
    background: false
# The panel shares one profile with the four orchestrator instances, so it must switch off everything
# a deployment owns: the orchestrator service, its two agent presets and the `spv` queue watcher.
- id: dsh-superagent
  disabled: true
- id: dsh-superagent-worker-preset
  disabled: true
- id: dsh-superagent-router-preset
  disabled: true
- id: wheelchair-spv
  disabled: true
